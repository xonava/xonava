name: Databases

on:
  pull_request:
    branches: [dev, main]
    # Documentation-only pull requests do not need the database jobs (ci.yml still runs verify:docs on every pull request).
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databases-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-pg:
    name: integration (pg)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: framework
          POSTGRES_PASSWORD: framework
          POSTGRES_DB: framework_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U framework -d framework_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: framework
          MYSQL_DATABASE: framework_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pframework"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      FRAMEWORK_TEST_PG_URL: postgres://framework:framework@localhost:5432/framework_test_db
      FRAMEWORK_TEST_MYSQL_URL: mysql://root:framework@127.0.0.1:3306/framework_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration:pg -w @xonava/testing
