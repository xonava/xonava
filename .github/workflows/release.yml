name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check the package contents without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push the release tags changesets creates
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # npm trusted publishing (OIDC, configured per package on npmjs.com) needs npm 11.5.1 or newer; Node 22 bundles
      # npm 10. With it, no npm token or secret is used, and provenance is attached automatically.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.21.1 && npm --version
      - name: Dry run (no publish)
        if: inputs.dry_run
        run: |
          npm run verify:version
          npm run build
          for workspace in @xonava/core @xonava/adapters @xonava/testing; do
            npm publish --dry-run --workspace "$workspace"
          done
      - name: Dry run tags (no push)
        if: inputs.dry_run
        run: |
          for dir in packages/core packages/adapters packages/testing; do
            echo "would tag $(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")"
          done
      # changesets creates annotated tags, which need a git identity; without one `git tag` fails and changesets
      # ignores the failure. The step below creates any missing tag itself and fails loudly, so it also repairs
      # a release whose tags were not pushed: re-running with dry_run off publishes nothing new and adds the tags.
      - name: Set the git identity for release tags
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm run release:publish
      - name: Push the release tags
        if: ${{ !inputs.dry_run }}
        run: |
          for dir in packages/core packages/adapters packages/testing; do
            tag="$(node -p "const p = require('./$dir/package.json'); p.name + '@' + p.version")"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "$tag is already on origin"
              continue
            fi
            git rev-parse --quiet --verify "refs/tags/$tag" > /dev/null || git tag --annotate "$tag" --message "$tag"
            git push origin "refs/tags/$tag"
          done
