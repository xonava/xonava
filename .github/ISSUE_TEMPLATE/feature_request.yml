name: Feature request
description: Suggest a new capability or an improvement to an existing one
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, check [docs/KNOWN-LIMITATIONS.md](https://github.com/xonava/xonava/blob/main/docs/KNOWN-LIMITATIONS.md)
        and the [specification](https://github.com/xonava/xonava/tree/main/docs/spec) to see whether the behaviour is already planned or intentionally excluded.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way? Describe the problem before the solution.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: What would you like the framework to do? A sketch of the API is welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you considered, including workarounds you use today.
    validations:
      required: false

  - type: dropdown
    id: package
    attributes:
      label: Affected package
      description: Which package would this change touch?
      options:
        - "@xonava/core"
        - "@xonava/adapters"
        - "@xonava/testing"
        - docs
        - other
    validations:
      required: true
