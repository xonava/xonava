name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and check the package contents without publishing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # npm trusted publishing (OIDC, configured per package on npmjs.com) needs npm 11.5.1 or newer; Node 22 bundles
      # npm 10. With it, no npm token or secret is used, and provenance is attached automatically.
      - name: Use an npm that supports trusted publishing
        run: npm install --global npm@11.21.1 && npm --version
      - name: Dry run (no publish)
        if: inputs.dry_run
        run: |
          npm run verify:version
          npm run build
          for workspace in @xonava/core @xonava/adapters @xonava/testing; do
            npm publish --dry-run --workspace "$workspace"
          done
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm run release:publish
